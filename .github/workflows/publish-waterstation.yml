name: Publish verified Water Station v2.2.2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify and unpack reviewed source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, os, subprocess
          archive = pathlib.Path('waterstation-v2.2.2-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '5e96e168b852f8b30e2c672acfd2f334eeddcba4e48b572fcb2752be064ee655'
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  target = (root / entry.filename).resolve()
                  assert target.is_relative_to(root) and '.git' not in pathlib.PurePosixPath(entry.filename).parts
                  source.extract(entry, root)
                  mode = entry.external_attr >> 16
                  if mode and not entry.is_dir():
                      os.chmod(target, mode & 0o777)
          archive.unlink()
          pathlib.Path('.github/workflows/publish-waterstation.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          with zipfile.ZipFile(__import__('io').BytesIO(subprocess.check_output(['git', 'show', 'HEAD:waterstation-v2.2.2-source.zip']))) as source:
              for entry in source.infolist():
                  if entry.is_dir():
                      continue
                  blob = subprocess.check_output(['git', 'hash-object', '-w', '--stdin'], input=source.read(entry)).decode().strip()
                  mode = '100755' if (entry.external_attr >> 16) & 0o111 else '100644'
                  subprocess.run(['git', 'update-index', '--add', '--cacheinfo', mode, blob, entry.filename], check=True)
          PY
      - name: Commit source while preserving repository history
        shell: bash
        run: |
          test "$(git write-tree)" = "0aeb2ca09b7c311c3e5813b35331af6eeb58e273"
          git diff --cached --check
          git restore --source=HEAD --staged --worktree -- .github/workflows/publish-waterstation.yml
          git config user.name "Sandara03"
          git config user.email "220882921+Sandara03@users.noreply.github.com"
          git commit -m "Update Water Station to v2.2.2 with Android and iPhone support"
          git push origin HEAD:main
